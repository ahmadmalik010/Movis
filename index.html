<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سینەما پڵەس</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎬 سینەما پڵەس</h1>
        <input type="text" id="searchBox" placeholder="گەڕان بەدوای فیلمدا...">
    </header>

    <nav class="categories">
        <button class="cat-btn active" onclick="filterCategory('all')">🔥 هەموو</button>
        <button class="cat-btn" onclick="filterCategory('Action')">⚡ ئاکشن</button>
        <button class="cat-btn" onclick="filterCategory('Sci-Fi')">🚀 خەیاڵی</button>
        <button class="cat-btn" onclick="filterCategory('Horror')">👻 ترسنۆک</button>
        <button class="cat-btn" onclick="filterCategory('Animation')">🎨 ئەنیمەیشن</button>
        <button class="cat-btn" onclick="filterCategory('series')">📺 زنجیرەکان</button>
        <button class="cat-btn" onclick="filterCategory('favorites')" style="border-color: #f39c12; color: #f39c12;">⭐ دڵخوازەکان</button>
        <button class="cat-btn" onclick="openAddMovieModal()" style="background-color: #e50914; color: white;">➕ فیلمی نوێ</button>
    </nav>

    <main>
        <div class="movies-grid" id="moviesContainer"></div>
    </main>

    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div id="videoContainer" style="display:none; margin-bottom: 10px;">
                <iframe id="modalVideo" width="100%" height="180" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <img id="modalImg" src="" alt="">
            <h2 id="modalTitle"></h2>
            <p id="modalInfo" style="font-size: 12px; color: #e50914;"></p>
            <p id="modalDesc" style="font-size: 13px; color: #ccc;"></p>
            
            <div class="action-buttons">
                <button id="watchBtn" class="action-btn play-btn" onclick="playTrailer()">▶ لێدانی ترەیلەر</button>
                <button id="favBtn" class="action-btn fav-action-btn" onclick="toggleFavorite()">⭐ دڵخواز</button>
                <button class="action-btn" onclick="deleteCurrentMovie()" style="background-color: #880000; color: white;">🗑 سڕینەوە</button>
            </div>

            <div class="comments-section">
                <h4>تێبینی و رای خۆت</h4>
                <div id="commentsList" class="comments-list"></div>
                <div class="comment-input-box">
                    <input type="text" id="commentInput" placeholder="شتێک بنووسە...">
                    <button onclick="addComment()">ناردن</button>
                </div>
            </div>
        </div>
    </div>

    <div id="addMovieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAddMovieModal()">&times;</span>
            <h2>➕ زیادکردنی فیلم و زنجیرە جیهانییەکان</h2>
            
            <div style="margin-bottom: 12px;">
                <label style="font-size: 11px; color: #f39c12; display: block; margin-bottom: 5px;">⭐ هێنانی فیلمەکان بە یەک کلیک بێ نوسین:</label>
                <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                    <button type="button" onclick="fetchMoviesByCategory('Action')" style="flex:1; background:#222; color:#fff; border:1px solid #e50914; padding:6px; border-radius:4px; cursor:pointer; font-size:11px;">⚡ ئاکشن</button>
                    <button type="button" onclick="fetchMoviesByCategory('Horror')" style="flex:1; background:#222; color:#fff; border:1px solid #e50914; padding:6px; border-radius:4px; cursor:pointer; font-size:11px;">👻 ترسنۆک</button>
                    <button type="button" onclick="fetchMoviesByCategory('Animation')" style="flex:1; background:#222; color:#fff; border:1px solid #e50914; padding:6px; border-radius:4px; cursor:pointer; font-size:11px;">🎨 ئەنیمەیشن</button>
                </div>
            </div>

            <div style="margin-bottom: 12px; border-top: 1px solid #333; padding-top: 10px;">
                <label style="font-size: 11px; color: #aaa;">گەڕان بەدوای ناوی فیلم یان زنجیرە (وەک Game of Thrones):</label>
                <div style="display: flex; gap: 5px; margin-top: 4px;">
                    <input type="text" id="searchApiTitle" placeholder="ناوی فیلم یان زنجیرە بنووسە..." style="flex:1; padding:8px; background:#222; border:none; color:#fff; border-radius:4px; outline:none;">
                    <button type="button" onclick="searchMoviesByQuery()" style="background:#e50914; color:white; border:none; padding:0 12px; border-radius:4px; cursor:pointer; font-weight:bold;">گەڕان</button>
                </div>
            </div>

            <div style="margin-bottom: 12px; border-top: 1px solid #333; padding-top: 10px;">
                <label style="font-size: 11px; color: #f39c12;">⭐ گەڕان بەدوای فیلمەکانی ئەکتەر:</label>
                <div style="display: flex; gap: 5px; margin-top: 4px;">
                    <input type="text" id="searchActorInput" placeholder="ناوی ئەکتەر..." style="flex:1; padding:8px; background:#222; border:none; color:#fff; border-radius:4px; outline:none;">
                    <button type="button" onclick="searchMoviesByActor()" style="background:#f39c12; color:#000; border:none; padding:0 12px; border-radius:4px; cursor:pointer; font-weight:bold;">گەڕانی ئەکتەر</button>
                </div>
            </div>

            <div id="apiSearchResults" style="max-height: 170px; overflow-y: auto; margin-bottom: 10px; background: #111; padding: 5px; border-radius: 4px;">
                <p style="color: #777; font-size: 11px; text-align: center;">هیچ ئەنجامێک نییە...</p>
            </div>
            
            <button type="button" onclick="addSelectedMoviesToDisplay()" style="width:100%; background:#e50914; color:white; border:none; padding:10px; border-radius:5px; margin-top:5px; cursor:pointer; font-weight:bold;">➕ زیادکردنی هەڵبژاردراوەکان بۆ دیسپڵەی</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
